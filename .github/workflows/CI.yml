name: CI

on:
  pull_request:
    branches: [main, ripple-dev]
  push:
    branches: [main, ripple-dev]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }} --group test ${{ matrix.python-version == '3.12' && '--group cross-validation' || '' }}
      - name: Run non-accuracy tests
        run: |
          if [[ "${{ matrix.python-version }}" == "3.12" ]]; then
            uv run pytest tests/ -m "not accuracy" --cov=ripplegw --cov-report=term-missing
          else
            uv run pytest tests/ -m "not accuracy"
          fi
      - name: Run accuracy smoke test
        if: matrix.python-version == '3.12' && (github.ref == 'refs/heads/main' || github.base_ref == 'main')
        run: uv run pytest -m "accuracy and smoke" --reference lal --n-samples 3
      - name: Upload coverage to Coveralls
        if: matrix.python-version == '3.12'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
        run: uv run coveralls

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --python 3.12 --group test
      - name: Run pre-commit
        run: uv run pre-commit run --all-files

  publish:
    needs: [test, pre-commit]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    environment:
      name: pypi
      url: https://pypi.org/project/ripplegw/
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Build package
        run: uv build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  merge-main-to-dev:
    needs: [publish]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ripple-dev
          fetch-depth: 0
      - name: Merge main into ripple-dev, or open a PR on conflict
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if git merge --no-edit origin/main; then
            git push origin ripple-dev
          else
            git merge --abort
            existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --base ripple-dev --head main --state open --json number --jq '.[0].number // empty')
            if [ -n "$existing" ]; then
              echo "PR #$existing already open for main -> ripple-dev merge."
            else
              gh pr create \
                --repo "$GITHUB_REPOSITORY" \
                --base ripple-dev \
                --head main \
                --title "Merge main into ripple-dev after release" \
                --body "Automated merge of main into ripple-dev failed due to conflicts. Please resolve manually."
            fi
          fi

  publish-testpypi:
    needs: [test, pre-commit]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: testpypi
      url: https://test.pypi.org/project/ripplegw/
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Build package
        run: uv build
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.TESTPYPI_API_TOKEN }}
          skip-existing: true
