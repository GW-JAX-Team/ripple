[project]
name = "rippleGW"
dynamic = ["version"]
description = "A JAX-based package for differentiable gravitational-wave waveform generation"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Thomas Edwards", email = "tedwards2412@gmail.com" },
]
maintainers = [
  {name = "Thomas Ng", email = "thomas.ng@nikhef.nl"}
]
license = { file = "LICENSE" }
keywords = ["gravitational waves", "jax"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
]

dependencies = [
    "jax>=0.8.2",
    "jaxtyping>=0.3.3",
]

[project.optional-dependencies]
cuda = [
    "jax[cuda]>=0.8.2",
]

[dependency-groups]
test = [
    "matplotlib>=3.7.0",
    "numpy>=1,<3",
    "pandas>=2.0.0",
    "pre-commit>=4.2.0",
    "coverage>=7.7.0",
    "coveralls>=4.0.1",
    "pytest>=8.3.3",
    "pytest-cov>=6.0.0",
    "ruff>=0.12.2",
    "tqdm>=4.66.0",
    "pyright>=1.1.402",
]
cross-validation = [
    "lalsuite",
]
doc = [
    "mkdocstrings[python]",
    "pymdown-extensions",
    "zensical",
]

[project.scripts]
ripple-benchmark = "ripplegw.benchmarks.timings.timing:main"

[project.urls]
Homepage = "https://github.com/GW-JAX-Team/ripple"
Documentation = "https://gw-jax-team.github.io/ripple/"
Repository = "https://github.com/GW-JAX-Team/ripple"
"Bug Tracker" = "https://github.com/GW-JAX-Team/ripple/issues"
Changelog = "https://github.com/GW-JAX-Team/ripple/releases"

[tool.uv.sources]
ripplegw = { workspace = true }

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"
raw-options = { local_scheme = "no-local-version" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "accuracy: compares waveform output against its registered reference calculation",
    "smoke: minimal accuracy subset cheap enough for CI",
]

[tool.ruff]
# Classify the installed package separately from third-party dependencies.
src = ["src"]

[tool.ruff.lint]
extend-select = ["E402"]
ignore = [
    "F722",  # Forward annotations evaluation (false positive with jaxtyping)
    "E731",  # Lambda assignment
    "UP007", # Keep explicit Union[...] annotations when they improve readability.
    "UP045", # Keep Optional[...] annotations rather than rewriting them as X | None.
]

[tool.ruff.lint.isort]
# Tests are part of this repository, not an external dependency.
known-first-party = ["tests"]

[tool.ruff.lint.extend-per-file-ignores]
"notebooks/*" = ["E402"]
# jax.config.update("jax_enable_x64", True) must run before any jax-dependent imports
"tests/*" = ["E402"]
# Waveform module names intentionally mirror established LAL waveform names and
# form part of ripple's public import paths.
"src/ripplegw/waveforms/**/*.py" = ["N999"]

[tool.pyright]
include = ["src"]
reportUnnecessaryTypeIgnoreComment = "error"

[tool.ty.src]
# Match Pyright's source-only scope; tests have optional LAL dependencies and
# remain covered by pytest and the explicitly requested Ruff test check.
include = ["src"]

[tool.coverage.report]
exclude_also = [
    'def __repr__',
    "raise AssertionError",
    "raise NotImplementedError",
    "@(abc\\. )?abstractmethod",
]
