[project]
site_name = "ripple"
site_url = "https://gw-jax-team.github.io/ripple/"
site_description = "A JAX-based package for differentiable gravitational-wave waveform generation"
site_author = "GW JAX Team"
repo_url = "https://github.com/GW-JAX-Team/ripple"
repo_name = "GW-JAX-Team/ripple"

extra_javascript = [
    "javascripts/mathjax.js",
    "https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js",
]

nav = [
    {"Home" = "index.md"},
    {"Installation" = "installation.md"},
    {"Quick Start" = "quickstart.md"},
    {"Guides" = [
        "guides/index.md",
        {"Working with Waveforms" = "guides/waveforms.md"},
        {"Parameters and Conventions" = "guides/parameters.md"},
        {"JAX Transformations" = "guides/jax.md"},
        {"Waveform Catalogue" = "guides/catalogue.md"},
        {"Benchmarking" = "guides/benchmarking.md"},
    ]},
    {"Developer Guide" = [
        "dev/index.md",
        {"Architecture" = "dev/architecture.md"},
        {"Adding a Waveform" = "dev/adding_a_waveform.md"},
        {"Testing" = "dev/testing.md"},
        {"Reference Implementations" = "dev/reference_implementations.md"},
    ]},
    {"FAQ" = "FAQ.md"},
    {"Citing ripple" = "citing.md"},
    {"Contributing" = "contributing.md"},
    # API section is auto-generated by docs/gen_api.py at build time
]

[project.extra.version]
provider = "mike"
default = "stable"

[project.theme]
variant = "modern"
features = [
    "content.code.copy",
    "navigation.instant",
    "navigation.tabs",
    "navigation.top",
    "toc.follow",
    "header.autohide",
]
palette = [
    {scheme = "slate", toggle = {icon = "material/brightness-4", name = "Switch to light mode"}},
    {scheme = "default", toggle = {icon = "material/brightness-7", name = "Switch to dark mode"}},
]

[project.markdown_extensions.pymdownx.arithmatex]
generic = true

[project.markdown_extensions.pymdownx.superfences]

[project.markdown_extensions.admonition]

[project.markdown_extensions.toc]
permalink = "¤"
toc_depth = 4

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
filters = ["!^_[^_]", "!^logger$"]
inherited_members = true
group_by_category = true
show_category_heading = false
summary = {attributes = true, functions = true}
show_root_heading = false
show_root_full_path = false
show_if_no_docstring = false
show_signature_annotations = true
show_source = false
members_order = ["__all__", "alphabetical"]
heading_level = 3
