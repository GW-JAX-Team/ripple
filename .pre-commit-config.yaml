ci:
  autoupdate_branch: ripple-dev
  autoupdate_schedule: quarterly
  # ty-pre-commit requires network access, which pre-commit.ci does not provide.
  skip: [pyright, ty]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
        args: ["--fix"]
        files: ^(src|tests)/
      - id: ruff-format
        files: ^(src|tests)/

  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.64
    hooks:
      - id: ty
        args: [--locked]

  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        files: src/
        require_serial: true
