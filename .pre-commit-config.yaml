repos:
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.10.7
    hooks:
      - id: uv-lock
        files: ^(pyproject\.toml|uv\.lock)$
        args: ["--upgrade"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.4
    hooks:
      - id: ruff-check
        args: ["--fix"]
        files: ^(src/|tests/)
      - id: ruff-format
        files: ^(src/|tests/)
  
