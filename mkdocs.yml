site_name: ripple
site_description: A JAX-based package for differentiable gravitational-wave waveform generation
site_author: GW JAX Team
repo_url: https://github.com/GW-JAX-Team/ripple
repo_name: GW-JAX-Team/ripple

theme:
    name: material
    features:
        - navigation
        - toc
        - header.autohide
    palette:
        - scheme: slate
          primary: black
          accent: amber
          toggle:
             icon: material/brightness-5
             name: Light mode
        - scheme: default
          primary: blue
          accent: deep purple
          toggle:
             icon: material/brightness-2
             name: Dark mode

markdown_extensions:
    - pymdownx.arithmatex:
        generic: true
    - pymdownx.superfences
    - pymdownx.details
    - pymdownx.snippets:
        base_path: docs
    - admonition
    - toc:
        permalink: "¤"
        toc_depth: 4

plugins:
    - search
    - autorefs
    - mkdocs-jupyter:
    - gen-files:
        scripts:
        - docs/gen_ref_pages.py
    - literate-nav:
        nav_file: SUMMARY.md
    - mkdocstrings:
        handlers:
            python:
                options:
                    docstring_style: google
                    inherited_members: true
                    show_root_heading: true
                    show_root_full_path: true
                    show_if_no_docstring: true
                    show_signature_annotations: true
                    show_source: false
                    members_order: source
                    heading_level: 4

nav:
    - Home: index.md
    - Installation: installation.md
    - Quick Start: quickstart.md
    - Tutorials:
        - Overview: tutorials/index.md
        - Generating Waveforms: tutorials/Generating_waveforms.ipynb
        - Validating IMRPhenomD: tutorials/check_IMRPhenomD.ipynb
        - Validating TaylorF2: tutorials/check_TaylorF2.ipynb
        - Validating IMRPhenomD_NRTv2: tutorials/check_IMRD_NRTv2.ipynb
        - Validating SineGaussian: tutorials/check_SineGaussian.ipynb
        - Working with Data: tutorials/data_example.ipynb
    - FAQ: FAQ.md
    - Contributing: contributing.md
    - Changelog: changelog.md
    - API: api/ripplegw/*